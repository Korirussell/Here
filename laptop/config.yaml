# HERE laptop (hearing module) tunables. README §6, §10, §11, §13, §15.
# (tune) = starting value, adjust after testing. Secrets never go here: see laptop/.env.example.
# Each section is also readable as UPPER_CASE names from laptop/<section>/config.py, so the
# ReSpeaker modules and their standalone CLIs keep working (e.g. audio.array_offset_deg -> C.ARRAY_OFFSET_DEG).

relay:
  # wss://<host>/ws for the Vultr relay (README §7); ws://<laptop-ip>:8080/ws for the local fallback relay.
  # Overridden by HERE_RELAY_URL / HERE_SESSION / HERE_RELAY_TOKEN (environment or laptop/.env).
  url: ws://localhost:8080/ws          # TODO(relay): set to wss://<vultr-host>/ws once deployed
  # Mirrors get the identical stream at the same time, each on its own link: one that is down or slow never
  # delays `url` (laptop/client/fanout.py). Keep the local relay as `url` (the reflex path) and the Vultr relay
  # here, so the phone can use either and memory/dashboards in the cloud still see everything.
  # Plus HERE_RELAY_MIRRORS (comma-separated) and --mirror.
  mirrors: []
  session: demo
  heartbeat_s: 2.0
  log: logs/laptop.jsonl

audio:
  sample_rate: 16000
  chunk_samples: 512                   # 32 ms capture blocks: VAD onset (speech_start) lands sooner
  audio_channel: 0                     # USB capture channel carrying the processed (beamformed) output

  # Array calibration (README §8). `python -m laptop.audio.calibrate` rewrites these two lines.
  array_offset_deg: 356.9
  array_clockwise: false

  # The wearer's own voice (README §5: they stand within 0.5 m of the array, so always at one world bearing).
  # Speech from within wearer_ignore_deg of it is never captioned and never buzzes the belt.
  # `python -m laptop.audio.calibrate --wearer` rewrites wearer_bearing_deg; null = filter off.
  wearer_bearing_deg: null
  wearer_ignore_deg: 20.0              # (tune) half-width; a talker standing right behind the wearer is lost too

  # What the USB audio carries (README §11). processed: the device's mix, one stream (the auto-select beam).
  # beams: the two focused beams on USB ch 0/1 (routing registers, restored on exit): two streams, each with
  # its own captions, sounds and direction (sources id 0/1), so a second talker or a baby crying behind the
  # wearer doesn't land in the first talker's caption. `python -m laptop --real --beams` / `--no-beams`.
  capture: beams
  # Beams mode: lock the two beams on these world bearings instead of letting them chase the loudest voice-like
  # sound (in the real test a baby crying at 180 took beam 0 and beam 1 sat idle, so the talker in front wasn't
  # heard). Demo positions are taped, so point them there: [front talker, behind]. null = auto-tracking.
  fixed_beams: [0.0, 180.0]
  # A fixed beam's speech keeps the beam's bearing (with this spread) when the firmware flags no speech during
  # it: in a loud room the flag misses quiet talkers (fixtures k1_room_live1), and name_called had no bearing.
  # Also the spread whenever speech_srp has no confident bearing (the firmware's readings all sit on the beam's
  # own bearing, so their spread of 0 claimed a precision they don't have).
  fixed_beam_spread_deg: 30.0
  # Fixed beams: speech_start / utterance bearings = where the talker is, from SRP-PHAT on the raw mics
  # (laptop/audio/localize.SpeechBearings), not the beam's bearing (two people in front at +-30 both read 0.8, so
  # the phone matched neither face). Only peaks in the beam's half of the room count, so the other beam's talker
  # can't take it; one bearing per utterance (median of its looks, no jitter between partials). Measured on raw
  # fixtures (CHANGELOG 2026-10-10 "speech bearings"): median error 6 deg vs 0.8-91 for the beam's bearing.
  speech_srp:
    enabled: true
    half_width_deg: 100.0              # the beam's half of the room (+10 deg so a talker at +-90 belongs to both)
    window_s: 1.0                      # newest audio per look
    relocate_s: 0.3                    # at most one look per utterance this often (~4 ms each)
    min_confidence: 0.6                # a look's SRP coherence: talkers 0.7-0.9, room noise / fan ghosts 0.3-0.55
    # A peak counts if >= this x the whole map's best. Measured 0.3-0.8: talkers in their own half, overlapping
    # ones included, kept 195/216 looks at every value (rot_two_talkers_180, talker_baby, single_0/180); a front
    # talker's leak into the rear beam found rear-half ghosts in 9/108 looks up to 0.7, 4/108 at 0.8. 0.8 drops a
    # talker who's as loud as one behind them and interleaved (test_speech_bearing): 0.5 keeps them.
    peak_rel: 0.5
    min_spread_deg: 8.0                # bearing_spread_deg floor: SRP's own error on the rotation scenes (2-9 deg)
    single_spread_deg: 15.0            # spread while the utterance has only one look
    outlier_deg: 45.0                  # looks this far from the median are strays...
    outlier_share: 0.2                 # ...unless this share of them: then spread covers all (two talkers, one half)
  # Beams mode: also count a beam as speech while its level stands over its own floor AND over the other beam
  # (laptop/events/level_speech.py). The firmware's flag missed a 0-5 dB SNR talker (fixtures/k1_room_live1), so
  # speech.endpoint_use_doa captioned nothing. Diffuse babble (equal on both beams), steady noise (the floor) and a
  # talker's leak into the other beam (quieter there) don't open it. Energy units: 1.0 = 45 dB.
  level_speech:
    enabled: false                     # off for the demo (WORKLOG_K1 "Which proposals to ship": no live gain shown yet; loud room takes WER 0.97 -> 0.26 when on)
    margin: 0.25                       # over the beam's floor (~11 dB)
    separation: 0.08                   # over the other beam (~3.6 dB)
    hold_s: 0.4
    confidence: 0.5                    # >= speech.bearing_min_confidence: the utterance gets the beam's bearing
    floor_rise_per_s: 0.02

  doa_source: builtin                  # builtin | odas (README §11; odas is a stub until the spike passes)
  # Booth robustness (laptop/audio/builtin_doa.py watchdog): the array counts as lost after loss_doa_fails USB
  # failures in a row, no audio for audio_stale_s, or a pause > sleep_gap_s (laptop slept). The heartbeat goes
  # degraded ("ReSpeaker lost ...; reconnecting") and HERE reconnects + sets the array up again every reconnect_s.
  # drill_file: touch it and a running --real laptop drops the array as if unplugged (tools/doa_usb_drill.py).
  loss_doa_fails: 10
  audio_stale_s: 1.5
  sleep_gap_s: 5.0
  reconnect_s: 2.0
  drill_file: logs/drill_array_drop
  doa_rate_hz: 20
  # confidence = speech energy mapped from conf_db_low..conf_db_high onto 0..1 (tune)
  conf_db_low: 20.0
  conf_db_high: 60.0
  # sources.energy: processed-audio level mapped from energy_dbfs_low..high onto 0..1 (tune)
  energy_dbfs_low: -60.0
  energy_dbfs_high: -15.0
  # Send `sources` at doa_rate_hz while speech/energy is present, otherwise only on change or every keepalive.
  sources_idle_change_deg: 3.0
  sources_keepalive_s: 1.0
  # What the phone sees as `sources` (laptop/events/tracker.py). Raw readings still go to speech and sounds.
  tracker:
    hold_s: 1.5                        # a track stays (same id) this long after it was last active, then expires (tune)
    snap_deg: 25.0                     # a reading this far from the track jumps there at once (new talker, no lag)
    alpha: 0.5                         # EMA on smaller moves
    nonspeech: onsets                  # a non-speech track = an onset on its stream (onsets) | level over floor (energy) | off
    nonspeech_hold_s: 1.0              # onsets: active this long after the onset (then hold_s more, listed quiet)
    ambience_window_s: 30.0            # onsets: a stream with more than ambience_max onsets in this window is
    ambience_max: 4                    # ambience (chatter, music): its onsets don't make tracks (real room: 125 in 5 min)
    active_margin: 0.12                # energy: over the track's noise floor that counts as active (~5 dB) (tune)
    floor_rise_per_s: 0.02             # how fast the floor follows a louder steady noise (fan, HVAC)
    overlap_window_s: 0.3              # two tracks active within this = overlap
    leak_margin: 0.15                  # a non-speech beam this much quieter than an active one is its leak (~7 dB);
                                       # measured 2026-10-10: a talker at 180 reads 0.5 on beam 1, 0.2-0.3 on beam 0
  # Onset candidates for the classifier (laptop/events/onsets.py, INTEGRATION_CONTRACT §5.1): per audio stream,
  # the block level vs its own noise floor (down fast, up floor_rise_db_per_s).
  onsets:
    margin_db: 10.0                    # this far over the floor ... (tune)
    min_s: 0.06                        # ... for this long = an onset (debounce, 2 blocks)
    cooldown_s: 1.5                    # per stream; a ding-dong is one candidate
    rearm_db: 4.0                      # and the level must fall back under floor + this first
    floor_rise_db_per_s: 1.5           # steady noise (fan, crowd hum) becomes the floor
    floor_fall: 0.3
    min_level_dbfs: -65.0              # quieter onsets are ignored
    warmup_s: 0.5                      # no onsets while a new stream's floor settles
  # The XVF3800's second focused beam as sources[1] when it hears speech >= 30 deg from the main DoA.
  # Off by default: README §12.5 says built-in DoA sends one source (MIGRATION_PLAN C11).
  builtin_beams_as_sources: false
  second_beam_min_sep_deg: 30.0

  # Beam and SRP azimuths are in the mic-geometry (AEC) frame; device = offset + sign * aec.
  # `python -m laptop.audio.calibrate` fits these too (front + right); or `python -m laptop.audio.localize --check`.
  aec_to_device_offset_deg: 356.3      # calibrated 2026-10-09 (python -m laptop.audio.calibrate): -0.8 deg
  aec_to_device_sign: 1                # calibrated 2026-10-09: not mirrored

  # LED ring (12 LEDs). "host" draws our bearings, "firmware" restores the device's DoA effect.
  ring_mode: host
  ring_led0_deg: 0.0                   # tune with `python -m laptop.audio.ring --follow`
  ring_led_step: 1
  ring_speech_color: 0x00C8FF
  ring_beam2_color: 0x5020FF
  ring_alert_color: 0xFF3000
  ring_min_level: 0.25
  ring_hold_s: 0.6                     # a marker fades over this after its last update (was 1.2: a trail)
  # Main marker (laptop/audio/ring.py RingPlanner): srp = our SRP-PHAT tracks on the raw mics, dark while the
  # firmware's free-running beam disagrees by > ring_veto_deg; doa = DOA_VALUE (2-ch firmware). auto = srp when
  # the raw mics are there. DOA_VALUE reports the active focused beam: with fixed beams it only says 0 or 180.
  ring_main: auto
  ring_veto_deg: 30.0
  # Second marker: auto = ODAS tracks with --odas, else another SRP track (>= ring_second_rel x the main one's
  # strength, alive >= ring_second_alive_s, has led), else the other auto-tracking beam; never a fixed beam (it points
  # where it was told). odas | srp | beams | off to force one.
  ring_second: auto
  ring_second_min_sep_deg: 45.0
  ring_second_rel: 0.6
  ring_second_alive_s: 0.3
  ring_second_leader_hops: 2           # and it must have been the loudest itself (an echo never is)
  # ring_main: doa only: the free-running beam stands in for DOA_VALUE for ring_onset_s after a speech onset
  # (DOA_VALUE holds the old talker ~0.15 s) and while DOA_VALUE sweeps (> ring_slew_deg per sample).
  ring_onset_s: 0.8
  ring_slew_deg: 5.0
  ring_alert_s: 4.0

  # Raw-mic SRP-PHAT direction for non-speech sounds (doorbell): needs the 6-channel USB firmware
  # (ch 0/1 processed, ch 2..5 raw mics). With the 2-channel firmware it switches itself off and
  # sound bearings fall back to recent `sources`.  TODO(hardware): which firmware is on the demo unit?
  raw_mic_channels: [2, 3, 4, 5]
  # What USB ch 3..6 carry (AUDIO_MGR_OP_CH3..6 category, volatile, restored to 1 on exit): 1 = raw mics, the
  # firmware default, ambient ~-78 dBFS = ~4 LSB of int16 (quantization dominates); 3 = the same mics after
  # AUDIO_MGR_MIC_GAIN (90x, +39 dB; ambient -35..-40 dBFS). Measured 2026-10-09. The processed ch 0/1 don't change.
  raw_mic_category: 3
  # Geometry mic i (AEC_MIC_ARRAY_GEO order) is raw column raw_mic_order[i]. Fitted by
  # `python -m laptop.audio.localize --fit fixtures/<raw recording>` (SRP and ODAS both use it).
  raw_mic_order: [0, 1, 2, 3]          # fitted 2026-10-09 on fixtures/raw_speaker_180 (5.8 deg median error);
                                       # its x-mirror [1, 0, 3, 2] can't be ruled out from 180: morning check
  raw_record_gain: 1.0                 # digital gain on raw.wav in --record (noted in meta.json); 1 with category 3
  raw_buffer_s: 12.0
  mic_geometry: null                   # [[x, y, z], ...] metres; null reads AEC_MIC_ARRAY_GEO from the device
  speed_of_sound: 343.0
  srp_nfft: 512
  srp_band_hz: [300.0, 6000.0]
  srp_max_window_s: 2.0
  srp_top_frames: 0.5
  srp_phat_beta: 0.5
  srp_min_confidence: 0.15

  odas:                                # README §11; read by laptop/audio/odas.py (off unless doa_source: odas)
    # ODAS runs in WSL2 (tools/odas/setup_wsl.sh) and connects to these Windows ports as a client
    # (WSL mirrored networking: Windows' 127.0.0.1 is reachable from WSL). laptop/audio/odas_cfg.py writes the
    # ODAS config from this section; laptop/audio/odas/here.cfg is the generated live config.
    host: 127.0.0.1
    port: 9000                         # tracked sources (JSON) -> OdasSource
    pots_port: 9001                    # potential sources (JSON), for debugging
    raw_port: 9002                     # raw mics -> ODAS (4 ch s16le, AEC geometry order)
    separated_port: 9003               # separated audio, one channel per track slot
    postfiltered_port: 9004            # post-filtered audio, one channel per track slot
    wsl_distro: Ubuntu
    binary: ~/here/odas/build/bin/odaslive
    launch: true                       # OdasSource starts odaslive in WSL itself (false: you start it)
    hop: 128                           # samples per ODAS frame step (8 ms)
    frame: 256
    max_sources: 4                     # tracked at once (sst.N_inactive entries)
    input_gain: 1.0                    # on the raw mics before ODAS (category 3 raw mics are loud enough)
    min_activity: 0.1                  # tracked sources below this activity aren't sent as `sources`
    speech_activity: 0.5               # activity >= this -> Source.speech (ODAS doesn't know speech from sound)
    activity_hold_s: 0.4               # per-track peak hold of ODAS activity (it flickers 0 <-> 1 within a word)
    audio: beams                       # beams (hybrid: steer the fixed beams to ODAS tracks) | separated | postfiltered
    # Tuned on the rotation scenes 2026-10-09 (DOA_VS_ODAS.md): probMin 0.5 -> 0.3 = median error 14.8 -> 11.6 deg,
    # same detection (85%) and two-source rate (66%). Shorter tracks (N_inactive 100) cut stale tracks 16 -> 3 s/min
    # but two-source detection fell to 5%. Any key of laptop/audio/odas_cfg.py DEFAULTS can be set here.
    probMin: 0.3

speech:
  sample_rate: 16000
  engine: faster_whisper               # faster_whisper | scribe_realtime (falls back to whisper automatically) | fake. Live A/B: HERE_SPEECH_ENGINE=scribe_realtime (env) or --engine; golden 7/7 needs whisper (Scribe: two_talkers WER 0.13)
  # FallbackTranscriber (engine: scribe_realtime): whisper takes over when Scribe errors or answers slower than
  # this, mid-utterance, with the whole utterance; Scribe is probed in the background every fallback_retry_s.
  fallback_max_latency_s: 1.5
  fallback_retry_s: 15.0
  scribe:                              # ElevenLabs Scribe v2 Realtime (laptop/speech/transcriber.py); key: ELEVENLABS_API_KEY in laptop/.env
    url: wss://api.elevenlabs.io/v1/speech-to-text/realtime
    model_id: scribe_v2_realtime
    language_code: en
    connect_timeout_s: 3.0
    partial_wait_s: 0.25               # a partial decode waits this long for a fresher partial_transcript
    final_timeout_s: 1.2               # commit -> committed_transcript; longer = whisper decodes the final instead
    stall_s: 3.0                       # audio sent and no message for this long = a dead connection
    pool: 2                            # warm WebSockets kept open (one per talking beam)
    chunk_s: 0.5                       # audio per input_audio_chunk (docs: 0.1-1 s)
    keyterms: false                    # send user_name + aliases as keyterms (untested against the live API)
  fake:                                # engine: fake (deterministic, no ASR; tests and wiring checks)
    lines: ["hey Kori the pizza is here", "did you see the email about the internship fair"]
    words_per_s: 2.5
  model: large-v3-turbo
  device: cuda
  compute_type: float16
  cpu_model: base.en                   # used automatically when no CUDA device is found
  cpu_compute_type: int8
  language: en
  final_beam_size: 5
  no_speech_drop: 0.6

  vad_window: 512                      # samples per Silero step at 16 kHz (fixed by Silero)
  vad_start: 0.5
  vad_continue: 0.35
  end_silence_s: 0.6                   # (tune) 0.45 and 0.5 tried 2026-10-10: golden 5/7 and 4/7 (utterances split, babble captioned)
  preroll_s: 0.25
  max_utterance_s: 15.0
  min_utterance_s: 0.3
  partial_every_s: 0.4                 # README §10: re-run every 0.3-0.5 s
  first_words_every_s: 0.2             # until the first words: re-decode this often (decodes come back empty
                                       # for the first ~0.2 s of a voice; real array: first words 605 -> see K1 proposals)

  loudness_range_db: 24.0              # loudness 0.5 = normal talking here; +12 dB -> 1.0, -12 dB -> 0.0

  # Utterance bearing (README §13 "On the laptop")
  bearing_min_confidence: 0.4
  overlap_spread_deg: 25.0
  onset_lookback_s: 0.4                # speech_start uses the newest speech direction within this window

  # Tone rules (README §14: how it sounded)
  tone_shout_loudness: 0.8            # ~7 dB above normal talking
  tone_whisper_loudness: 0.12          # ~9 dB below
  tone_laugh_min: 0.15                 # PANNs laughter during the utterance -> "laughing". Speech and babble score <= 0.01, real laughs 0.2-0.35 (CHANGELOG Task 5)

  name_match_ratio: 0.8                # fuzzy match of user_name / name_aliases
  # The user's name + aliases reach whisper as a decoding hint: hotwords (faster-whisper's hint prompt),
  # prompt (initial_prompt "Kori, Cory."), or off. Measured with tools/stress_test.py (CHANGELOG).
  name_hints: prompt
  # The team's names spelled our way in captions (whole words, case-insensitive). Not a decoding hint: putting
  # every name in whisper's prompt made it write "Jena, Kori, Tre, Adil, Here." back on noise (2026-10-10 live).
  # Name called still comes only from names.user_name / aliases (or the phone's).
  spellings:
    Kori: [Corey, Cory, Kory, Corrie]
    Tre: [Trey, Tray]
    Jennah: [Jenna, Jena]
    Adil: [Adele, Adeel, Odil, Adill]

  # Hallucinations (whisper inventing text on noise). Unless the array heard a talker for longer than
  # hallucination_array_s during the utterance, final segments whisper itself doubts (avg_logprob) are
  # dropped, and so are texts made only of these phrases. Looping segments (compression ratio) always are.
  logprob_min: -1.0                    # segment avg_logprob below this = guessing (whisper's default)
  compression_max: 2.4                 # segment compression ratio above this = looping text (whisper's default)
  # Confident speech readings spread wider than this during an utterance = crowd babble from everywhere,
  # not one talker (one talker spreads ~0.5 deg on the array): not captioned.
  diffuse_spread_deg: 60.0             # (tune; with the array's real crowd behaviour, see SPIKE.md)
  hallucination_array_s: 1.0
  hallucinations: ["thank you", "thank you very much", "thank you so much", "thanks", "thanks for watching",
                   "thank you for watching", "thank you so much for watching", "thanks for listening",
                   "thank you for listening", "please subscribe", "subscribe", "bye", "bye bye", "goodbye",
                   "you", "so", "oh", "um", "uh", "uh huh", "hmm", "mm", "mhm", "ah", "huh"]

  # Segmentation with the array (tools/stress_test.py: in crowd babble Silero hears speech all the time,
  # so VAD alone never ends an utterance). When the direction source reports speech, an utterance only
  # starts while the array also hears a talker, counts as silent when it doesn't, ends on a turn change,
  # and is dropped if the array barely heard it.
  endpoint_use_doa: true
  doa_quiet_s: 0.5                     # no confident speech reading for this long = the talker stopped
  doa_min_speech_s: 0.3
  # A stream's classifier hears a non-speech sound (baby crying, doorbell, alarm... laughter excluded) louder
  # than speech for at least nonspeech_share of an utterance: not captioned (the sound gets its alert).
  nonspeech_min: 0.3
  # Which classifier labels may veto a caption. Not music / tv: background music outscored speech and dropped
  # "Kori." with no alert in return (real room, Mario Party). K1 proposal (c).
  nonspeech_labels: [doorbell, dog_barking, baby_crying, knock, alarm, loud_bang, phone_ringing, car_horn, vehicle,
                     siren, door]
  nonspeech_share: 0.25               # 0.5 let "That's a good question." through on the baby's beam (real test)
  turn_change_deg: 40.0                # speech direction moved this far and stayed: new utterance
  # Silero often fires a few words late on the array's processed audio (real-array test: "Hey Kori, the"
  # scored 0.01-0.32 while the array already flagged speech). With DoA gating, an utterance's audio starts
  # where the array started hearing the talker (+ preroll_s), up to this far back.
  array_lookback_s: 1.5                # (tune) K1 proposal (c): 0.8 cut "Hey Kori," off at -5 dB (Silero fired late)

sounds:
  enabled: true
  sample_rate: 16000
  model_sr: 32000
  window_s: 1.0                        # README §10: 0.5-1 s windows with overlap
  hop_s: 0.5
  device: cuda                         # exactly "cuda": panns_inference ignores "cuda:0"
  model_dir: ~/panns_data
  checkpoint_url: "https://zenodo.org/record/3987831/files/Cnn14_mAP%3D0.431.pth?download=1"
  checkpoint_md5: 541141fa2ee191a88f24a3219fff024e   # Zenodo's; checked after each download
  labels_url: "http://storage.googleapis.com/us_audioset/youtube_corpus/v1/csv/class_labels_indices.csv"
  model: panns_cnn14                   # the classifier (sounds.models key); sound_event.model names it
  fallback: panns_cnn14                # if `model` fails to load or mid-session
  buffer_s: 3.0                        # audio kept for onset windows
  onset_queue: 4                       # K1 onset candidates waiting to be classified (drop the oldest)
  onset_pre_s: 0.1                     # an onset window starts this long before the onset
  # Honest unknowns (INTEGRATION_CONTRACT §4): an onset no label explains, loud and long enough.
  unknown:
    enabled: true
    min_energy: 0.18                   # onset energy (0..1, sources scale) (tune; was 0.25: 24 real sounds dropped as too faint in the 2026-10-10 live test)
    min_rise_db: 10.0                  # over the stream's noise floor (K1's detector margin)
    min_active_s: 0.1                  # within 10 dB of its peak this long: a click isn't an event (was 0.15; a door click is short)
    upgrade_s: 3.0                     # a known label this soon after re-labels the same event_id
    cooldown_s: 2.5                    # another unknown this soon merges into the open one (was 6.0: 195 merged in 20 min live)
    ambient_n: 4                       # this many unknowns within ambient_window_s = ambience: merge, don't send (was 3)
    ambient_window_s: 30.0
  # Sound classifier backends (laptop/sounds/models.py). Bakeoff: tools/sound_bench.py, results in
  # HERE_36hr_vibecode_plan/WORKLOG_A2.md. kind: panns | audioset (HF, 527 AudioSet outputs) | clap (zero-shot).
  models:
    panns_cnn14: {kind: panns}
    MIT/ast-finetuned-audioset-10-10-0.4593: {kind: audioset, sigmoid: true}
    mispeech/ced-base: {kind: audioset, trust_remote_code: true, sigmoid: false, min_s: 1.0,
                        revision: db3e14a8db4c21b56b165261c39649741a900e7f}
    mispeech/ced-mini: {kind: audioset, trust_remote_code: true, sigmoid: false, min_s: 1.0,
                        revision: 26c3ebcae85d4330f4fc26763f029539a3afcda0}
    laion/larger_clap_general: {kind: clap}
  # CLAP zero-shot prompts per SoundLabel; "background" prompts soak up probability and map to nothing.
  clap_prompts:
    speech: ["people talking", "a person speaking"]
    doorbell: ["a doorbell ringing", "a ding-dong doorbell chime"]
    dog_barking: ["a dog barking"]
    baby_crying: ["a baby crying"]
    knock: ["knocking on a door"]
    alarm: ["an alarm clock beeping", "a smoke alarm beeping"]
    siren: ["an emergency vehicle siren", "a police siren"]
    car_horn: ["a car horn honking"]
    vehicle: ["a car engine running", "traffic passing by"]
    door: ["a door closing", "a door slamming"]
    phone_ringing: ["a phone ringing"]
    loud_bang: ["a loud bang", "an explosion"]
    laughter: ["people laughing"]
    music: ["music playing"]
    tv: ["a television in the background"]
    background: ["background noise", "silence", "a fan humming", "rain falling", "keyboard typing", "water running",
                 "a vacuum cleaner", "wind blowing"]
  merge_gap_s: 3.0
  publish_speech: false
  default_threshold: 0.3               # clipwise probability (tune on hall recordings)
  thresholds:
    doorbell: 0.25
    door: 0.2                          # PANNs clipwise scores for short impacts sit low, like the doorbell (tune)
    knock: 0.2
    loud_bang: 0.5
    music: 0.4
    speech: 0.5
  genre_min: 0.15
  # "Teach HERE your doorbell": template-match these recordings too (laptop/sounds/enrolled.py). Far more
  # robust in crowd babble than the classifier. For the demo, enroll the exact file the speaker plays.
  enrolled:
    - {label: doorbell, file: fixtures/sounds/doorbell.wav, threshold: 0.12,   # synthetic ding-dong (TODO: real one)
       head_s: 0.5, head_threshold: 0.25}  # K1 proposal (b): the first 0.5 s alone, matched early_after_s after an onset
  early_after_s: 0.6                   # enrolled-head check this long after an onset (0 = off); 0.6 = the 0.5 s head fully heard
  # Labels that produce sound_events. Core = doorbell (README §3); the rest are extras.
  # dog_barking is off for the demo: no dog at the booth, and PANNs called room noise 'Dog' at 0.47-0.69 on
  # 2026-10-11 (two false alerts that would buzz a judge's belt). Add it back for a real dog.
  publish: [doorbell, baby_crying, door, knock, alarm, siren, car_horn, phone_ringing, loud_bang]   # actionable sounds; ambience (music, laughter, tv, vehicle, speech) stays unpublished. Was [doorbell, baby_crying]: doors and knocks never reached the phone (2026-10-10 live test)
  # Contract SoundLabel -> AudioSet class names (PANNs label list). Score = max over the classes.
  label_map:
    speech: ["Speech", "Male speech, man speaking", "Female speech, woman speaking", "Child speech, kid speaking", "Conversation", "Narration, monologue"]
    doorbell: ["Doorbell", "Ding-dong"]
    dog_barking: ["Bark", "Dog", "Yip", "Bow-wow", "Growling", "Whimper (dog)"]
    baby_crying: ["Baby cry, infant cry"]
    knock: ["Knock"]
    alarm: ["Alarm", "Alarm clock", "Buzzer", "Car alarm", "Smoke detector, smoke alarm", "Fire alarm"]
    siren: ["Siren", "Civil defense siren", "Police car (siren)", "Ambulance (siren)", "Fire engine, fire truck (siren)", "Emergency vehicle"]
    car_horn: ["Vehicle horn, car horn, honking", "Air horn, truck horn"]
    vehicle: ["Vehicle", "Motor vehicle (road)", "Car", "Car passing by", "Truck", "Bus", "Motorcycle", "Traffic noise, roadway noise"]
    door: ["Door", "Sliding door"]
    phone_ringing: ["Telephone bell ringing", "Ringtone", "Telephone"]
    loud_bang: ["Bang", "Slam", "Explosion", "Gunshot, gunfire", "Burst, pop"]
    laughter: ["Laughter", "Snicker", "Giggle", "Chuckle, chortle", "Belly laugh", "Baby laughter"]   # all of AudioSet's Laughter family
    music: ["Music"]
    tv: ["Television"]

alerts:
  min_confidence: 0.6                  # README §15 (tune)
  min_confidence_by_kind:
    doorbell: 0.25                     # PANNs clipwise scores for a doorbell sit well below 0.6 (tune)
    loud_bang: 0.8                     # never "gunshot"
    dog_barking: 0.85                  # false 'Dog' on room noise scored 0.47-0.69 (2026-10-11 live)
    baby_crying: 0.4                   # PANNs on a real cry: median 0.44, max 0.73 (1 s windows); speech/babble ~0 (tune)
  dedupe_s: 4.0                        # same kind from a similar direction within this updates the alert
  dedupe_deg: 45.0
  expire_s: 10.0

# Enrichment after the fact (laptop/enrich/, HERE_36hr_vibecode_plan/Shared/ATTENTION.md): perception_enrichment.
# Never blocks or changes the canonical sound_event / utterance / alert. `python -m laptop --no-enrich` turns it off.
enrich:
  enabled: true
  # Attention tiers, best first; deterministic rules always come last. JEV-9B loads only with a CUDA GPU.
  # JEV-9B measured 2026-10-10 (python -m laptop.enrich.attention --bench, RTX 5000 Ada, nf4): loads in 62 s, 5.7 GB
  # (7.7 GB peak), median 496 / worst 970 ms per decision: gate 3 (<= 250 / 600 ms) FAILS; agreement 14/30 vs DeBERTa
  # 15/30. Per ATTENTION.md ("if any gate fails, the demo uses tier 2") it is off. Its slow path is Qwen3.5's gated
  # delta rule without flash-linear-attention, which needs a newer Triton than torch 2.5.1 allows on Windows.
  # Opt in: tiers: [autotrust/JEV-9B, MoritzLaurer/deberta-v3-base-zeroshot-v2.0]
  tiers: [MoritzLaurer/deberta-v3-base-zeroshot-v2.0]
  device: cuda                         # falls back to CPU for the zero-shot tier
  jev_quant: nf4                       # nf4 (4-bit, ~6 GB) | int8 (~10 GB) | bf16 (18 GB: too big for the demo GPU)
  timeouts_s: {jev: 0.6, zeroshot_gpu: 0.3, zeroshot_cpu: 1.5}
  min_confidence: 0.5                  # a tier's top probability under this -> the next tier decides
  queue_max: 4                         # drop the oldest
  cache_s: 5.0                         # identical states reuse the decision
  max_rate_hz: 5.0
  # Tier-2 wording, tuned on the 30 labelled states + 5 from the fixtures (WORKLOG_A2 "attention tuning"): of 7
  # attention wordings this one had the most right (17/35, obvious 11/15) and the fewest confidently wrong (5).
  # JEV-9B keeps the option lines in laptop/enrich/states.py.
  zeroshot_template: "This is {}."
  zeroshot_options:
    ambient: background noise that nobody needs to react to
    notice: an everyday event that is mildly interesting
    important: something that calls for the listener to respond
    urgent: an emergency where someone could be in danger
  zeroshot_directed_template: "{}"
  zeroshot_directed: ["The speaker is asking or telling the listener something.", "The speaker is chatting with someone else."]
  zeroshot_threads: 4                  # torch threads on CPU; more was slower on a P+E-core laptop
  # Gemini: GEMINI_API_KEY in laptop/.env; off without it.
  gemini_enabled: true
  gemini_model: gemini-2.5-flash
  gemini_timeout_s: 4.0
  gemini_min_gap_s: 2.0                # debounce: at most one call per this
  gemini_cache_s: 60.0
  gemini_min_words: 3                  # finals shorter than this don't go to Gemini
  gemini_pause_default_s: 60.0         # a quota (429) error pauses Gemini this long when it gives no retryDelay
  gemini_pause_max_s: 600.0            # cap on retryDelay (and the pause after a key error): retry every 10 min

names:
  # Used until the phone sends `config`. The phone's user_name / name_aliases replace these.
  user_name: Jennah                   # the demo wearer (2026-10-10); the phone's Settings > You overrides it
  aliases: [Jenna, Jena]

mock:
  fixture: fixtures/mock_scene         # --mock replays this synthetic scene (no hardware)
  user_name: Kori                      # so the scripted "Hey Kori!" raises name_called
  loop: true

# 3D sound field in the browser (python -m laptop ... --viz, laptop/viz.py). Local only: binds 127.0.0.1.
viz:
  host: 127.0.0.1
  port: 8770
  rate_hz: 12                    # frames per second to the page (an SRP map each)
  az_step_deg: 6.0               # heat-map grid: azimuth step x these elevations (planar array: elevation is coarse)
  elevations_deg: [0, 15, 30, 45, 60, 75]
  window_s: 0.25                 # raw audio per map
  gate_db: 4.0                   # band level over the room's floor before the map lights up
  open_browser: true
