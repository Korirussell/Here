<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HERE Sound Field</title>
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(12, 17, 28, 0.78);
    --line: rgba(140, 170, 220, 0.18);
    --text: #dfe8f7;
    --dim: #7f8ba3;
    --accent: #38d9f5;
    --warn: #ffb347;
    --bad: #ff5d6c;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); padding: 10px 14px; }
  #title { top: 16px; left: 16px; }
  #title h1 { margin: 0; font-size: 15px; letter-spacing: 0.04em; font-weight: 600; }
  #title .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #status { top: 16px; right: 16px; min-width: 210px; }
  .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); display: inline-block; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .meter { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 8px; }
  .meter > div { height: 100%; width: 0%; background: linear-gradient(90deg, #0b3d91, var(--accent), #ffd166);
    transition: width 80ms linear; }
  .small { color: var(--dim); font-size: 11px; }
  #layers { bottom: 16px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(560px, calc(100vw - 32px)); }
  #layers button { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 11px; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  #layers button.on { color: var(--text); border-color: rgba(140, 170, 220, 0.45); background: rgba(56, 217, 245, 0.08); }
  #layers .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  #list { bottom: 16px; right: 16px; width: 240px; max-height: 45vh; overflow: auto; }
  #list h2 { margin: 0 0 6px; font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  #list .item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  #list .item:last-child { border-bottom: 0; }
  #hint { position: fixed; top: 76px; left: 16px; color: var(--dim); font-size: 11px; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    color: var(--dim); padding: 24px; pointer-events: none; }
  @media (max-width: 640px) {
    #list { display: none; }
    #status { min-width: 0; left: 16px; right: 16px; top: auto; bottom: 76px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="title" class="panel"><h1>HERE · sound field</h1><div class="sub" id="sub">connecting…</div></div>
<div id="hint">drag to orbit · scroll to zoom · double-click to reset · you look in from behind the wearer</div>
<div id="status" class="panel">
  <div class="row"><span><span class="dot" id="conn"></span>&nbsp; <span id="connText">offline</span></span><span class="small" id="fps"></span></div>
  <div class="meter"><div id="act"></div></div>
  <div class="row small" style="margin-top:6px"><span id="lvl">sound –</span><span id="raw"></span></div>
</div>
<div id="layers" class="panel"></div>
<div id="list" class="panel"><h2>Now</h2><div id="items"><span class="small">nothing heard</span></div></div>
<div id="msg"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

// ---- frame: world bearings, clockwise from the array's front; the wearer looks along -Z --------------------
const D2R = Math.PI / 180;
function dir(az, el, r = 1) {
  const c = Math.cos(el * D2R);
  return new THREE.Vector3(r * c * Math.sin(az * D2R), r * Math.sin(el * D2R), -r * c * Math.cos(az * D2R));
}
const wrap = a => ((a + 180) % 360 + 360) % 360 - 180;

// ---- scene -------------------------------------------------------------------------------------------------
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 4, 9);
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 50);
const target = new THREE.Vector3(0, 0.18, 0);
const orbit = { theta: 0, phi: 58 * D2R, r: 3.1 };
function placeCamera() {
  camera.position.set(
    target.x + orbit.r * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    target.y + orbit.r * Math.cos(orbit.phi),
    target.z + orbit.r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
  camera.lookAt(target);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize); resize(); placeCamera();

// orbit by hand (no extra library): drag, wheel, pinch-free double-click reset
let drag = null, autoRotate = false;
renderer.domElement.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener("pointermove", e => {
  if (!drag) return;
  orbit.theta -= (e.clientX - drag.x) * 0.006;
  orbit.phi = Math.min(1.52, Math.max(0.12, orbit.phi - (e.clientY - drag.y) * 0.006));
  drag = { x: e.clientX, y: e.clientY }; placeCamera();
});
renderer.domElement.addEventListener("pointerup", () => drag = null);
renderer.domElement.addEventListener("wheel", e => { e.preventDefault(); orbit.r = Math.min(7, Math.max(1.5, orbit.r * (1 + e.deltaY * 0.001))); placeCamera(); }, { passive: false });
renderer.domElement.addEventListener("dblclick", () => { orbit.theta = 0; orbit.phi = 58 * D2R; orbit.r = 3.1; placeCamera(); });

// soft glow texture for markers
function glowTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(0.25, "rgba(255,255,255,0.55)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture();
function textSprite(text, color = "#7f8ba3", size = 0.16) {
  const c = document.createElement("canvas"), g = c.getContext("2d");
  c.width = 256; c.height = 64;
  g.font = "600 30px ui-sans-serif, system-ui, Segoe UI, sans-serif"; g.fillStyle = color;
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 128, 32);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(size * 4, size, 1);
  return s;
}

// floor: polar grid + compass
const floor = new THREE.Group(); scene.add(floor);
const gridMat = new THREE.LineBasicMaterial({ color: 0x8caadc, transparent: true, opacity: 0.12 });
for (const r of [0.25, 0.5, 0.75, 1.0]) {
  const pts = []; for (let a = 0; a <= 360; a += 4) pts.push(dir(a, 0, r));
  floor.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}
for (let a = 0; a < 360; a += 30) {
  floor.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([dir(a, 0, 0.18), dir(a, 0, 1.08)]), gridMat));
  if (a % 90) { const t = textSprite(`${wrap(a) > 0 ? "+" : ""}${wrap(a)}°`, "#4d5872", 0.09); t.position.copy(dir(a, 0, 1.17)); floor.add(t); }
}
for (const [a, name] of [[0, "FRONT"], [90, "RIGHT"], [180, "BEHIND"], [270, "LEFT"]]) {
  const t = textSprite(name, a === 0 ? "#38d9f5" : "#9aa6bf", 0.12); t.position.copy(dir(a, 0, 1.3)); floor.add(t);
}
// sky: latitude rings + meridians
const sky = new THREE.Group(); scene.add(sky);
const skyMat = new THREE.LineBasicMaterial({ color: 0x8caadc, transparent: true, opacity: 0.07 });
for (const el of [30, 60]) { const pts = []; for (let a = 0; a <= 360; a += 4) pts.push(dir(a, el)); sky.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), skyMat)); }
for (let a = 0; a < 360; a += 45) { const pts = []; for (let el = 0; el <= 90; el += 3) pts.push(dir(a, el)); sky.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), skyMat)); }

// heat map: hemisphere with additive vertex colours (black = invisible)
const hemiGeo = new THREE.SphereGeometry(1, 120, 30, 0, Math.PI * 2, 0, Math.PI / 2);
const nV = hemiGeo.attributes.position.count;
const colors = new Float32Array(nV * 3);
hemiGeo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
const heat = new THREE.Mesh(hemiGeo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
scene.add(heat);
const vAz = new Float32Array(nV), vEl = new Float32Array(nV), vVal = new Float32Array(nV);
for (let i = 0; i < nV; i++) {
  const x = hemiGeo.attributes.position.getX(i), y = hemiGeo.attributes.position.getY(i), z = hemiGeo.attributes.position.getZ(i);
  vEl[i] = Math.asin(Math.max(-1, Math.min(1, y))) / D2R;
  vAz[i] = ((Math.atan2(x, -z) / D2R) + 360) % 360;
}
const STOPS = [[0, [0, 0, 0]], [0.3, [0.04, 0.15, 0.45]], [0.55, [0.0, 0.62, 0.85]], [0.8, [1.0, 0.78, 0.32]], [1, [1, 1, 1]]];
function cmap(v) {
  for (let k = 1; k < STOPS.length; k++) if (v <= STOPS[k][0]) {
    const [a, ca] = STOPS[k - 1], [b, cb] = STOPS[k], f = (v - a) / (b - a);
    return [ca[0] + (cb[0] - ca[0]) * f, ca[1] + (cb[1] - ca[1]) * f, ca[2] + (cb[2] - ca[2]) * f];
  }
  return STOPS[STOPS.length - 1][1];
}
let sampler = null;     // per vertex: 4 grid indices + weights (bilinear, azimuth wraps)
function buildSampler(grid) {
  const nAz = grid.az.length, els = grid.el, step = 360 / nAz;
  sampler = { idx: new Int32Array(nV * 4), w: new Float32Array(nV * 4), fade: new Float32Array(nV), rows: els.length, cols: nAz };
  for (let i = 0; i < nV; i++) {
    const fa = vAz[i] / step, a0 = Math.floor(fa) % nAz, a1 = (a0 + 1) % nAz, ta = fa - Math.floor(fa);
    let e0 = 0, te = 0;
    const el = Math.min(vEl[i], els[els.length - 1]);
    for (let k = 0; k < els.length - 1; k++) if (el >= els[k]) { e0 = k; te = (el - els[k]) / (els[k + 1] - els[k]); }
    if (el >= els[els.length - 1]) { e0 = els.length - 1; te = 0; }
    const e1 = Math.min(els.length - 1, e0 + 1);
    const j = i * 4;
    sampler.idx[j] = e0 * nAz + a0; sampler.idx[j + 1] = e0 * nAz + a1; sampler.idx[j + 2] = e1 * nAz + a0; sampler.idx[j + 3] = e1 * nAz + a1;
    sampler.w[j] = (1 - te) * (1 - ta); sampler.w[j + 1] = (1 - te) * ta; sampler.w[j + 2] = te * (1 - ta); sampler.w[j + 3] = te * ta;
    sampler.fade[i] = vEl[i] > els[els.length - 1] ? Math.max(0, 1 - (vEl[i] - els[els.length - 1]) / 15) : 1;
  }
}
function applyMap(map, activity) {
  if (!sampler) return;
  const flat = map ? map.flat() : null;
  let mean = 0, max = 0;       // "mean" = the 80th percentile: only the peaks glow (a 66 mm array's peaks are wide)
  if (flat) { const srt = flat.slice().sort((x, y) => x - y); mean = srt[Math.floor(srt.length * 0.8)]; max = srt[srt.length - 1]; }
  const gain = flat ? (activity > 0 ? 0.25 + 0.75 * activity : 0.07) : 0;
  for (let i = 0; i < nV; i++) {
    let v = 0;
    if (flat) {
      const j = i * 4;
      const p = flat[sampler.idx[j]] * sampler.w[j] + flat[sampler.idx[j + 1]] * sampler.w[j + 1]
              + flat[sampler.idx[j + 2]] * sampler.w[j + 2] + flat[sampler.idx[j + 3]] * sampler.w[j + 3];
      v = Math.max(0, (p - mean) / (max - mean + 1e-6));
      v = Math.pow(v, 1.4) * gain * sampler.fade[i];
    }
    vVal[i] = vVal[i] * 0.45 + v * 0.55;          // a little smoothing between frames
  }
}
function paintHeat() {
  for (let i = 0; i < nV; i++) { const c = cmap(Math.min(1, vVal[i])); colors[i * 3] = c[0]; colors[i * 3 + 1] = c[1]; colors[i * 3 + 2] = c[2]; }
  hemiGeo.attributes.color.needsUpdate = true;
}

// the array: plate, 4 mics, 12 LEDs, front notch
const arrayG = new THREE.Group(); scene.add(arrayG);
arrayG.add(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 48), new THREE.MeshBasicMaterial({ color: 0x141b29 })));
const notch = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.06, 12), new THREE.MeshBasicMaterial({ color: 0x38d9f5 }));
notch.rotation.x = -Math.PI / 2; notch.position.copy(dir(0, 0, 0.2)); notch.position.y = 0.011; arrayG.add(notch);
const micMat = new THREE.MeshBasicMaterial({ color: 0x9aa6bf });
let ledMeshes = [];
function buildArray(h) {
  for (const az of h.mics_az) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), micMat); m.position.copy(dir(az, 0, 0.066)); m.position.y = 0.016; arrayG.add(m); }
  ledMeshes.forEach(m => arrayG.remove(m)); ledMeshes = [];
  for (const az of h.leds_az) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 8), new THREE.MeshBasicMaterial({ color: 0x222a38 }));
    m.position.copy(dir(az, 0, 0.13)); m.position.y = 0.016;
    const g = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: 0x000000, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    g.scale.set(0.11, 0.11, 1); m.add(g); m.userData.glow = g;
    arrayG.add(m); ledMeshes.push(m);
  }
}

// markers with trails
const PALETTE = [0xff5d8f, 0x7cff6b, 0xffb347, 0x6bc5ff, 0xc792ea, 0xfff176];
const markers = new Map();   // key -> {group, line, trail, pts, last}
function marker(key, color, size) {
  if (markers.has(key)) return markers.get(key);
  const group = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 12), new THREE.MeshBasicMaterial({ color }));
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  glow.scale.set(size * 9, size * 9, 1); ball.add(glow); group.add(ball);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55 }));
  const trailGeo = new THREE.BufferGeometry();
  const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 }));
  const label = textSprite(key.split(":")[1] || "", "#dfe8f7", 0.07);
  ball.add(label); label.position.set(0, size * 2.6, 0);
  scene.add(group, line, trail);
  const m = { group, ball, glow, line, trail, trailGeo, pts: [], last: 0, layer: key.split(":")[0] };
  markers.set(key, m);
  return m;
}
function updateMarker(m, az, el, r, strength, now) {
  const p = dir(az, el, r);
  m.ball.position.copy(p);
  m.glow.material.opacity = 0.35 + 0.65 * strength;
  m.line.geometry.setFromPoints([new THREE.Vector3(0, 0.02, 0), p]);
  m.pts.push({ p, t: now }); m.last = now;
}
function pruneMarkers(now) {
  for (const [key, m] of markers) {
    m.pts = m.pts.filter(x => now - x.t < 3.0);
    m.trailGeo.setFromPoints(m.pts.map(x => x.p));
    const gone = now - m.last;
    const vis = layers[m.layer] && gone < 1.2;
    m.ball.visible = m.line.visible = vis; m.trail.visible = layers[m.layer];
    m.ball.scale.setScalar(Math.max(0.4, 1 - gone));
    if (gone > 4) { scene.remove(m.group, m.line, m.trail); markers.delete(key); }
  }
}

// ODAS potential sources: energy points
const POTS_MAX = 64;
const potsGeo = new THREE.BufferGeometry();
const potsPos = new Float32Array(POTS_MAX * 3), potsCol = new Float32Array(POTS_MAX * 3);
potsGeo.setAttribute("position", new THREE.BufferAttribute(potsPos, 3));
potsGeo.setAttribute("color", new THREE.BufferAttribute(potsCol, 3));
const potsPts = new THREE.Points(potsGeo, new THREE.PointsMaterial({ size: 0.09, map: GLOW, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(potsPts);
const potsHist = [];
function addPots(pots, now) {
  for (const p of pots) potsHist.push({ ...p, t: now });
  while (potsHist.length > POTS_MAX || (potsHist.length && now - potsHist[0].t > 1.5)) potsHist.shift();
  potsPos.fill(0); potsCol.fill(0);
  potsHist.forEach((p, i) => {
    const v = dir(p.az, p.el, 0.99), age = 1 - (now - p.t) / 1.5, e = Math.min(1, p.e) * age;
    potsPos.set([v.x, v.y, v.z], i * 3); potsCol.set([1.0 * e, 0.7 * e, 0.25 * e], i * 3);
  });
  potsGeo.attributes.position.needsUpdate = potsGeo.attributes.color.needsUpdate = true;
  potsGeo.setDrawRange(0, potsHist.length);
}

// ---- layers UI -------------------------------------------------------------------------------------------
const layers = { heat: true, odas: true, pots: true, srp: true, src: true, sky: true };
const LAYER_UI = [["heat", "Heat map (our SRP)", "#00b4d8"], ["odas", "ODAS tracks", "#ff5d8f"], ["pots", "ODAS energy", "#ffb347"],
  ["srp", "Our tracks", "#ffffff"], ["src", "Sent to phone", "#38d9f5"], ["sky", "Sky grid", "#4d5872"]];
const layersEl = document.getElementById("layers");
for (const [k, name, col] of LAYER_UI) {
  const b = document.createElement("button"); b.className = "on";
  b.innerHTML = `<span class="sw" style="background:${col}"></span>${name}`;
  b.onclick = () => { layers[k] = !layers[k]; b.classList.toggle("on", layers[k]); };
  layersEl.appendChild(b);
}
const rot = document.createElement("button"); rot.innerHTML = "Auto-rotate";
rot.onclick = () => { autoRotate = !autoRotate; rot.classList.toggle("on", autoRotate); };
layersEl.appendChild(rot);

// ---- data -------------------------------------------------------------------------------------------------
let latest = null, fresh = false, frames = 0, lastFpsT = performance.now();
const $ = id => document.getElementById(id);
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { $("conn").classList.add("ok"); $("connText").textContent = "live"; };
  ws.onclose = () => { $("conn").classList.remove("ok"); $("connText").textContent = "offline, retrying"; setTimeout(connect, 1000); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "hello") {
      buildSampler(m.grid); buildArray(m);
      $("sub").textContent = `${m.directions}${m.odas ? " · ODAS on" : ""} · ${m.grid.az.length}×${m.grid.el.length} grid`;
    } else if (m.type === "frame") { latest = m; fresh = true; frames++; }
  };
}
connect();

function sourcesList(m) {
  const rows = [];
  for (const s of m.sources) rows.push(`<div class="item"><span style="color:#38d9f5">phone · ${s.id}${s.speech ? " · speech" : ""}</span><span>${s.az > 0 ? "+" : ""}${s.az.toFixed(0)}°</span></div>`);
  for (const s of m.tracks) rows.push(`<div class="item"><span style="color:#${PALETTE[s.id % PALETTE.length].toString(16).padStart(6, "0")}">ODAS · ${s.id}</span><span>${s.az > 0 ? "+" : ""}${s.az.toFixed(0)}° · ${s.el.toFixed(0)}° up</span></div>`);
  for (const s of m.srp) rows.push(`<div class="item"><span>ours · ${s.id}</span><span>${s.az > 0 ? "+" : ""}${s.az.toFixed(0)}°</span></div>`);
  return rows.length ? rows.join("") : `<span class="small">nothing heard</span>`;
}

function onFrame(m, now) {
  applyMap(layers.heat ? m.map : null, m.activity);
  $("act").style.width = `${Math.round(m.activity * 100)}%`;
  $("lvl").textContent = `sound ${m.level_db >= 0 ? "+" : ""}${m.level_db.toFixed(1)} dB over the room`;
  $("raw").textContent = m.raw ? "raw mics ✓" : "no raw mics";
  $("items").innerHTML = sourcesList(m);
  for (const s of m.tracks) if (s.a > 0.05) updateMarker(marker(`odas:${s.id}`, PALETTE[s.id % PALETTE.length], 0.04), s.az, s.el, 1.0, s.a, now);
  for (const s of m.srp) updateMarker(marker(`srp:${s.id}`, 0xffffff, 0.025), s.az, 0, 1.06, Math.min(1, s.v * 1.6), now);
  for (const s of m.sources) if (s.speech || s.c > 0) updateMarker(marker(`src:${s.id}`, 0x38d9f5, 0.03), s.az, 0, 1.13, s.c, now);
  addPots(layers.pots ? m.pots : [], now);
  if (m.leds && ledMeshes.length === 12) m.leds.forEach((c, i) => {
    const col = new THREE.Color(c), lit = c !== "#000000";
    ledMeshes[i].material.color.set(lit ? col : 0x222a38); ledMeshes[i].userData.glow.material.color.set(lit ? col : 0x000000);
  });
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  if (fresh && latest) { onFrame(latest, now); fresh = false; }
  else if (latest && !layers.heat) applyMap(null, 0);
  paintHeat();
  pruneMarkers(now);
  heat.visible = layers.heat; sky.visible = layers.sky; potsPts.visible = layers.pots;
  if (autoRotate && !drag) { orbit.theta += 0.0025; placeCamera(); }
  if (performance.now() - lastFpsT > 1000) { $("fps").textContent = `${frames} frames/s`; frames = 0; lastFpsT = performance.now(); }
  renderer.render(scene, camera);
}
animate();
</script>
<script>
  // three.js comes from the CDN: say so instead of a black page when it can't load
  window.addEventListener("error", e => {
    if (String(e.message || "").includes("three") || (e.target && e.target.tagName === "SCRIPT")) {
      const m = document.getElementById("msg"); m.style.display = "flex";
      m.textContent = "Couldn't load three.js from cdn.jsdelivr.net: the 3D view needs internet once.";
    }
  }, true);
</script>
